# Push a tag like v1.2.0 to build the universal app, publish a GitHub release,
# and update the Homebrew cask in Jasurito/homebrew-tap.
#
# Needs repo secrets:
#   SIGNING_P12_BASE64, SIGNING_P12_PASSWORD: the code-signing identity.
#   TAP_DEPLOY_KEY: SSH deploy key with write access to Jasurito/homebrew-tap.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Users' Accessibility grant is tied to this certificate. A release signed with
  # any other one would make every user allow Accessibility again.
  SIGNING_CERT_SHA1: 31fa106ab2668eca3ffa6d013093be8b85e71bcc

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Test
        run: swift test

      - name: Build universal app
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="BarMod-$VERSION.zip"
          VERSION="$VERSION" ARCHS="arm64 x86_64" Scripts/build.sh
          codesign -d -r- build/BarMod.app 2>&1 | grep -q "$SIGNING_CERT_SHA1"
          (cd build && ditto -c -k --norsrc --noextattr --noacl --keepParent BarMod.app "$ZIP")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "build/$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "build/$ZIP" \
            --title "BarMod $VERSION" --generate-notes

      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update Homebrew cask
        run: |
          mkdir -p tap/Casks
          sed -e '/^# /d' -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" \
            packaging/barmod.rb > tap/Casks/barmod.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/barmod.rb
          git commit -m "barmod $VERSION"
          git push
